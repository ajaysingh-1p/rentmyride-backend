# ───────────────────────────────────────────────────
#   Profile: dev  (active by default — this is what you get running locally with no env vars set)
# ───────────────────────────────────────────────────

# ── MySQL (local) ───────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/RentMyRide?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
# Same default password the project already used locally — fine for a throwaway local dev DB,
# but note it's no longer hardcoded/committed: override with DB_PASSWORD for your own machine.
spring.datasource.password=${DB_PASSWORD:Ajay@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-updates the schema from your entities as you code — convenient locally, dangerous in prod
# (issue #7). Prod uses "validate" instead (see application-prod.properties).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── JWT ─────────────────────────────────────────────
# Dev-only fallback secret so the app still boots with zero setup. Override with a real JWT_SECRET
# even in dev if you want your local tokens to survive you rotating this file. Prod REQUIRES the
# env var and has no fallback at all (issue #6).
jwt.secret=${JWT_SECRET:RentMyRide2024SecretKeyForJWTHS256Algorithm!@#}

# ── Logging ─────────────────────────────────────────
# Verbose on purpose for local debugging. Prod turns this down (issue #7) since DEBUG here can
# print request/response bodies and SQL bind values, i.e. real user data, into log files.
logging.level.com.rentmyride=DEBUG
logging.level.org.springframework.security=INFO
